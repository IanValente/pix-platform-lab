services:
  postgres-pix:
    image: postgres:15-alpine
    container_name: db_pix
    restart: unless-stopped
    environment:
      POSTGRES_USER: pix_user
      POSTGRES_PASSWORD: pix_password
      POSTGRES_DB: pix_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq-pix:
    image: rabbitmq:3-management-alpine
    container_name: broker_pix
    restart: unless-stopped
    ports:
      - "5672:5672"   # Porta para as aplicações (Java/Node/.NET) se conectarem
      - "15672:15672" # Porta da Interface Gráfica (Painel de Administração)

volumes:
  postgres_data: